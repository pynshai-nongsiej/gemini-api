<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Studio — Local Operator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

<div class="app">
  <!-- ======================= SIDEBAR ======================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">⚡</div>
      <div>
        <div class="brand-name">Shorts Studio</div>
        <div class="brand-sub">local operator</div>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item" data-tab="overview"><span class="ico">◈</span> Overview</button>
      <button class="nav-item" data-tab="channels"><span class="ico">⛁</span> Channels</button>
      <button class="nav-item" data-tab="generate"><span class="ico">✦</span> Generate<span class="nav-badge" id="badge-gen" hidden></span></button>
      <button class="nav-item" data-tab="review"><span class="ico">◉</span> Review<span class="nav-badge warn" id="badge-review" hidden></span></button>
      <button class="nav-item" data-tab="library"><span class="ico">▦</span> Library</button>
      <button class="nav-item" data-tab="publish"><span class="ico">▲</span> Publish<span class="nav-badge ok" id="badge-pub" hidden></span></button>
      <button class="nav-item" data-tab="analytics"><span class="ico">◔</span> Analytics</button>
      <button class="nav-item" data-tab="settings"><span class="ico">⚙</span> Settings</button>
    </nav>

    <div class="sidebar-foot">
      <div class="ready-card" id="ready-card" onclick="switchTab('settings')">
        <div class="ready-dot" id="ready-dot"></div>
        <div>
          <div class="ready-title" id="ready-title">checking…</div>
          <div class="ready-sub" id="ready-sub">component status</div>
        </div>
      </div>
      <div class="yt-card" id="yt-card">
        <span id="yt-status-icon" class="yt-ico">▷</span>
        <span id="yt-status-text">YouTube not connected</span>
      </div>
    </div>
  </aside>

  <!-- ======================= MAIN ======================= -->
  <main class="main" id="main"></main>
</div>

<div class="toasts" id="toasts"></div>
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script src="app.js?v=4"></script>
</body>
</html>
