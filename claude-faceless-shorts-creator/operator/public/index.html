<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Shorts Operator</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151d; --panel2: #171b26; --border: #232838;
    --text: #e7eaf2; --dim: #8b93a7; --accent: #7dd3fc; --accent2: #a78bfa;
    --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px;
           background: var(--panel); border-bottom: 1px solid var(--border);
           position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.5px; }
  header h1 span { color: var(--accent); }
  nav { display: flex; gap: 4px; margin-left: 24px; }
  nav button { background: none; border: 1px solid transparent; color: var(--dim);
               padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  nav button.active { background: var(--panel2); color: var(--accent); border-color: var(--border); }
  nav button:hover { color: var(--text); }
  #readiness-badge { margin-left: auto; font-size: 12px; padding: 4px 12px;
                     border-radius: 999px; border: 1px solid var(--border); }
  main { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .grid { display: grid; gap: 16px; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
          overflow: hidden; }
  .card video, .card img.thumb { width: 100%; aspect-ratio: 9/16; object-fit: cover;
          background: #000; display: block; }
  .card .body { padding: 12px 14px; }
  .card h3 { margin: 0 0 4px; font-size: 14px; }
  .meta { color: var(--dim); font-size: 12px; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 999px;
          border: 1px solid var(--border); margin-right: 6px; }
  .pill.needs_review { color: var(--warn); border-color: #4a3b12; }
  .pill.approved { color: var(--accent); }
  .pill.published { color: var(--ok); border-color: #14432a; }
  .pill.rejected { color: var(--err); }
  .pill.queued, .pill.scheduled { color: var(--accent2); }
  .pill.running, .pill.publishing { color: var(--warn); }
  .pill.completed { color: var(--ok); }
  .pill.failed, .pill.cancelled { color: var(--err); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
               border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  button.btn.primary { background: var(--accent); color: #08111a; border-color: var(--accent); font-weight: 600; }
  button.btn.danger:hover { border-color: var(--err); color: var(--err); }
  button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
  input, select, textarea { background: var(--panel2); border: 1px solid var(--border);
         color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 13px;
         font-family: inherit; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label { font-size: 12px; color: var(--dim); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
           padding: 20px; margin-bottom: 20px; }
  .panel h2 { margin: 0 0 14px; font-size: 15px; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 8px 10px;
       border-bottom: 1px solid var(--border); font-size: 12px; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .stat .v { font-size: 24px; font-weight: 700; color: var(--accent); }
  .stat .l { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  #toast { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
  .toast { background: var(--panel2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
           padding: 10px 16px; border-radius: 8px; font-size: 13px; max-width: 380px;
           animation: fadein 0.2s; }
  .toast.err { border-left-color: var(--err); }
  .toast.ok { border-left-color: var(--ok); }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
  pre.log { background: #080a0f; border: 1px solid var(--border); border-radius: 8px;
            padding: 12px; font-size: 11px; max-height: 300px; overflow: auto;
            font-family: ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none;
              align-items: center; justify-content: center; z-index: 50; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
           padding: 24px; width: min(860px, 94vw); max-height: 92vh; overflow: auto; }
  .modal video { width: 100%; max-height: 50vh; border-radius: 10px; background: #000; }
  .dim { color: var(--dim); }
  a { color: var(--accent); text-decoration: none; }
  .check { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 13px; }
  .check .s { width: 18px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>⚡ Local Shorts <span>Operator</span></h1>
  <nav id="nav">
    <button data-tab="generate" class="active">Generate</button>
    <button data-tab="library">Library</button>
    <button data-tab="review">Review <span id="review-count" class="pill needs_review" style="display:none">0</span></button>
    <button data-tab="publish">Publish</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div id="readiness-badge" class="pill">checking…</div>
</header>
<main id="main"></main>
<div id="toast"></div>

<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script src="app.js"></script>
</body>
</html>
