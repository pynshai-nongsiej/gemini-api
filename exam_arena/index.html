<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex LDA Exam Arena · Meghalaya Civil Service & DSC Cadre</title>
  <meta name="description" content="Next-generation exam prep arena and AI question engine for Meghalaya Public Service Commission (MPSC) and District Selection Committee (DSC) West Khasi Hills LDA examinations.">

  <!-- Google Fonts: Outfit (Headings) + Plus Jakarta Sans (Body) + JetBrains Mono (Numbers/Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       DESIGN SYSTEM: ui-ux-pro-max (Bento Box + Glassmorphism + Micro-Interactions)
       ========================================================================== */
    :root {
      /* Typography */
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Base Light Palette */
      --bg-canvas: #F8FAFC;
      --bg-surface: rgba(255, 255, 255, 0.88);
      --bg-surface-elevated: #FFFFFF;
      --bg-surface-subtle: #F1F5F9;
      --border-subtle: rgba(226, 232, 240, 0.9);
      --border-strong: #CBD5E1;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;

      /* Accent & Semantic */
      --color-primary: #4F46E5;        /* Indigo */
      --color-primary-light: #EEF2FF;
      --color-primary-glow: rgba(79, 70, 229, 0.2);
      --color-secondary: #0EA5E9;      /* Sky */
      --color-accent: #F59E0B;         /* Amber Flame */
      --color-accent-light: #FEF3C7;
      --color-success: #10B981;        /* Emerald */
      --color-success-light: #ECFDF5;
      --color-danger: #EF4444;         /* Coral Rose */
      --color-danger-light: #FEF2F2;

      /* Subject Palette */
      --sub-gk: #0284C7;
      --sub-gk-bg: rgba(2, 132, 199, 0.12);
      --sub-eng: #7C3AED;
      --sub-eng-bg: rgba(124, 58, 237, 0.12);
      --sub-math: #D97706;
      --sub-math-bg: rgba(217, 119, 6, 0.12);
      --sub-comp: #059669;
      --sub-comp-bg: rgba(5, 150, 105, 0.12);
      --sub-sci: #0D9488;
      --sub-sci-bg: rgba(13, 148, 136, 0.12);
      --sub-rea: #6366F1;
      --sub-rea-bg: rgba(99, 102, 241, 0.12);

      /* Effects */
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12);
      --glass-blur: blur(16px);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --transition-fast: 160ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 240ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      /* Base Dark Palette */
      --bg-canvas: #090D16;
      --bg-surface: rgba(17, 24, 39, 0.85);
      --bg-surface-elevated: #162032;
      --bg-surface-subtle: #1E293B;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;

      --color-primary: #6366F1;
      --color-primary-light: rgba(99, 102, 241, 0.18);
      --color-primary-glow: rgba(99, 102, 241, 0.35);
      --color-secondary: #38BDF8;
      --color-accent: #F59E0B;
      --color-accent-light: rgba(245, 158, 11, 0.18);
      --color-success: #10B981;
      --color-success-light: rgba(16, 185, 129, 0.18);
      --color-danger: #F43F5E;
      --color-danger-light: rgba(244, 63, 94, 0.18);

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.5);
      --shadow-lg: 0 16px 40px rgba(0,0,0,0.65);
    }

    /* Reset & Global */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: var(--font-body);
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      overflow-x: hidden;
    }

    body {
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.06) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* Ambient background blur blobs */
    .ambient-glow {
      position: fixed;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--color-primary-glow) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
      animation: float 22s infinite alternate ease-in-out;
    }
    @keyframes float {
      0% { transform: translate(-20%, -20%) scale(1); }
      100% { transform: translate(40%, 30%) scale(1.15); }
    }

    /* Typography */
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font-family: inherit; }

    /* Icons */
    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .icon.sm { width: 16px; height: 16px; }
    .icon.lg { width: 24px; height: 24px; }
    .icon.xl { width: 32px; height: 32px; }

    /* Layout Containers */
    .app-shell {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px 24px 60px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .app-shell { padding: 12px 14px 40px; gap: 16px; }
    }

    /* ==========================================================================
       NAVIGATION BAR (Floating Glassmorphism)
       ========================================================================== */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 14px;
      z-index: 50;
      transition: all var(--transition-normal);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-logo-badge {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-primary), #818CF8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      box-shadow: 0 4px 12px var(--color-primary-glow);
    }

    .brand-text { display: flex; flex-direction: column; }
    .brand-title {
      font-family: var(--font-heading);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Navigation Links / Tabs */
    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface-subtle);
      padding: 4px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
    }

    .nav-tab-btn {
      padding: 8px 16px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }

    .nav-tab-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
    .nav-tab-btn.active {
      background: var(--bg-surface-elevated);
      color: var(--color-primary);
      box-shadow: var(--shadow-sm);
    }

    /* Nav Actions */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .server-status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border-subtle);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-success);
      box-shadow: 0 0 8px var(--color-success);
    }
    .status-dot.offline { background: var(--color-danger); box-shadow: 0 0 8px var(--color-danger); }
    .status-dot.checking { background: var(--color-accent); box-shadow: 0 0 8px var(--color-accent); animation: pulse 1.5s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .theme-toggle-btn, .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface-subtle);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .theme-toggle-btn:hover, .icon-btn:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    /* Candidate Profile Pill */
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: var(--color-primary-light);
      border: 1px solid var(--color-primary-glow);
      color: var(--color-primary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .user-pill:hover { filter: brightness(1.08); transform: translateY(-1px); }

    /* ==========================================================================
       BUTTONS & UI COMPONENTS
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all var(--transition-fast);
      white-space: nowrap;
      user-select: none;
    }
    .btn:active { transform: translateY(1px); }
    .btn.sm { padding: 6px 12px; font-size: 12px; border-radius: var(--radius-sm); }
    .btn.lg { padding: 14px 28px; font-size: 16px; border-radius: var(--radius-md); }

    .btn-primary {
      background: var(--color-primary);
      color: #FFFFFF;
      box-shadow: 0 4px 14px var(--color-primary-glow);
    }
    .btn-primary:hover {
      background: #4338CA;
      box-shadow: 0 6px 20px var(--color-primary-glow);
      transform: translateY(-1px);
    }

    .btn-accent {
      background: linear-gradient(135deg, #F59E0B, #EA580C);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }
    .btn-accent:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .btn-secondary:hover {
      background: var(--bg-surface-subtle);
      border-color: var(--text-secondary);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }
    .btn-ghost:hover {
      background: var(--bg-surface-subtle);
      color: var(--text-primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    /* Cards & Bento Grid */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 20px;
    }

    .card {
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-normal);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
    }

    .col-12 { grid-column: span 12; }
    .col-8  { grid-column: span 8; }
    .col-6  { grid-column: span 6; }
    .col-4  { grid-column: span 4; }
    .col-3  { grid-column: span 3; }

    @media (max-width: 1024px) {
      .col-8, .col-4, .col-6, .col-3 { grid-column: span 12; }
      .bento-grid { gap: 16px; }
    }

    /* ==========================================================================
       HERO COMMAND BANNER
       ========================================================================== */
    .hero-banner {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.14) 0%, rgba(14, 165, 233, 0.08) 100%), var(--bg-surface);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: var(--radius-lg);
      padding: 32px;
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 28px;
      align-items: center;
      position: relative;
    }
    @media (max-width: 900px) {
      .hero-banner { grid-template-columns: 1fr; padding: 22px; gap: 20px; }
    }

    .hero-left { display: flex; flex-direction: column; gap: 14px; }
    .hero-meta-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .hero-title {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    .hero-desc {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 580px;
      line-height: 1.6;
    }

    .hero-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }

    .hero-stats-panel {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
    }

    .stat-tile {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-subtle);
    }
    .stat-val {
      font-family: var(--font-heading);
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1;
    }
    .stat-lbl {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* ==========================================================================
       SUBJECT TILES & BENTO CARDS
       ========================================================================== */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .section-title-box { display: flex; align-items: center; gap: 10px; }
    .section-title { font-size: 20px; font-weight: 700; }
    .section-badge {
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
      background: var(--bg-surface-subtle);
      color: var(--text-muted);
    }

    .subject-card {
      padding: 20px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: pointer;
      transition: all var(--transition-normal);
      position: relative;
    }
    .subject-card:hover {
      border-color: var(--color-primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .subject-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .subject-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
    }
    .subject-icon-box {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .subject-topics-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .topic-chip {
      font-size: 12px;
      color: var(--text-secondary);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-subtle);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all var(--transition-fast);
    }
    .topic-chip:hover {
      color: var(--color-primary);
      background: var(--color-primary-light);
    }

    /* ==========================================================================
       QUIZ ARENA & TEST ENGINE UI
       ========================================================================== */
    .quiz-container {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .quiz-header-card {
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .quiz-info-meta { display: flex; flex-direction: column; gap: 4px; }
    .quiz-title { font-size: 20px; font-weight: 800; }
    .quiz-subtitle { font-size: 13px; color: var(--text-muted); }

    .quiz-timer-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border-subtle);
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .quiz-timer-box.warning {
      background: var(--color-danger-light);
      border-color: var(--color-danger);
      color: var(--color-danger);
      animation: pulse 1s infinite;
    }

    /* Progress & Stepper Bar */
    .quiz-progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--bg-surface-subtle);
      border-radius: var(--radius-full);
      overflow: hidden;
      position: relative;
    }
    .quiz-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
      border-radius: var(--radius-full);
      transition: width var(--transition-normal);
    }

    /* Question Main Card */
    .question-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      box-shadow: var(--shadow-md);
      position: relative;
    }
    @media (max-width: 768px) {
      .question-card { padding: 20px; gap: 18px; }
    }

    .question-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .question-index-badge {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--color-primary);
      background: var(--color-primary-light);
      padding: 4px 12px;
      border-radius: var(--radius-full);
    }

    .question-actions-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .question-text {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.55;
      color: var(--text-primary);
    }

    /* Options Stack */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-radius: var(--radius-md);
      background: var(--bg-surface-subtle);
      border: 1.5px solid var(--border-subtle);
      color: var(--text-primary);
      text-align: left;
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
      user-select: none;
    }
    .option-btn:hover {
      border-color: var(--color-primary);
      background: var(--bg-surface-elevated);
      transform: translateX(2px);
    }

    .option-btn.selected {
      border-color: var(--color-primary);
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: 600;
    }

    /* Immediate feedback state */
    .option-btn.correct {
      border-color: var(--color-success) !important;
      background: var(--color-success-light) !important;
      color: var(--color-success) !important;
      font-weight: 700;
    }
    .option-btn.wrong {
      border-color: var(--color-danger) !important;
      background: var(--color-danger-light) !important;
      color: var(--color-danger) !important;
      opacity: 0.85;
    }

    .option-key-badge {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }
    .option-btn.selected .option-key-badge {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #FFFFFF;
    }
    .option-btn.correct .option-key-badge {
      background: var(--color-success);
      border-color: var(--color-success);
      color: #FFFFFF;
    }
    .option-btn.wrong .option-key-badge {
      background: var(--color-danger);
      border-color: var(--color-danger);
      color: #FFFFFF;
    }

    .option-text {
      font-size: 15px;
      flex-grow: 1;
      line-height: 1.4;
    }

    /* Explanation / Tip Card */
    .tip-box {
      margin-top: 10px;
      padding: 16px 20px;
      border-radius: var(--radius-md);
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeIn 200ms ease;
    }

    .tip-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--color-success);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tip-body {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .quiz-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .quiz-drawer-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
      padding: 12px;
      background: var(--bg-surface-subtle);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }
    .q-dot-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface-elevated);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);

    .q-dot-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }

    .q-dot-btn.answered { background: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary); }
    .q-dot-btn.flagged { background: var(--color-accent-light); color: var(--color-accent); border-color: var(--color-accent); }

       ========================================================================== */

      padding: 36px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: conic-gradient(var(--color-primary) calc(var(--score-pct, 0) * 1%), var(--bg-surface-subtle) 0);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px var(--color-primary-glow);
      position: relative;
    }
    .score-circle-inner {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: var(--bg-surface-elevated);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .score-big-num {
      font-family: var(--font-heading);
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
      color: var(--text-primary);
    }
    .score-denom {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .scorecard-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin: 16px 0;
    }

    /* ==========================================================================
       AI QUESTION STUDIO & GENERATION MODAL
       ========================================================================== */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .form-input, .form-select {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: var(--bg-surface-subtle);
      border: 1.5px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all var(--transition-fast);
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-glow);
    }

    /* Track selector radio cards */
    .track-radio-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .track-radio-card {
      padding: 14px 18px;
      border-radius: var(--radius-md);
      background: var(--bg-surface-subtle);
      border: 1.5px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .track-radio-card.active {
      border-color: var(--color-primary);
      background: var(--color-primary-light);
    }
    .track-name { font-weight: 700; font-size: 14px; }
    .track-desc { font-size: 12px; color: var(--text-muted); }

    /* ==========================================================================
       MODAL & DRAWER SYSTEM
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 150ms ease;
    }
    .modal-box {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 620px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* ==========================================================================
       FLASHCARD FLIP MODE
       ========================================================================== */
    .flashcard-wrapper {
      perspective: 1000px;
      min-height: 320px;
      cursor: pointer;
    }
    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 320px;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }
    .flashcard-front, .flashcard-back {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius-lg);
      padding: 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1.5px solid var(--border-subtle);
      box-shadow: var(--shadow-md);
    }
    .flashcard-front {
      background: var(--bg-surface-elevated);
    }
    .flashcard-back {
      background: var(--bg-surface);
      transform: rotateY(180deg);
      border-color: var(--color-primary);
    }

    /* ==========================================================================
       FOOTER & UTILITY
       ========================================================================== */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 0 10px;
      border-top: 1px solid var(--border-subtle);
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }
    .footer-brand { font-weight: 700; color: var(--text-secondary); }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

</head>

       INITIALIZATION & SYNC
       ========================================================================== */
    async function initApp() {
      loadLocalProgress();
      await checkServer();
      if (authToken) {
        await checkAuthMe();
        await loadHistory();
      }
      await fetchQuestionBankStats();
      renderApp();

      // Global keyboard navigation
      window.addEventListener('keydown', handleGlobalKeydown);
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      localStorage.setItem(THEME_KEY, currentTheme);
      renderApp();
    }

    function loadLocalProgress() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) progress = Object.assign(progress, JSON.parse(saved));
      } catch (e) {}
    }

    function saveLocalProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      } catch (e) {}
      // Sync to SQLite if connected
      if (authToken) {
        fetch('/api/progress', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify(progress)
        }).catch(() => {});
      }
    }

    function authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      if (authToken) h['Authorization'] = 'Bearer ' + authToken;
      return h;
    }

    async function checkServer() {
      serverStatus.state = 'checking';
      const t0 = performance.now();
      try {
        const res = await fetch('/api/status', { signal: AbortSignal.timeout(4000) });
        if (res.ok) {
          const d = await res.json();
          serverStatus.state = 'online';
          serverStatus.latencyMs = Math.round(performance.now() - t0);
          serverStatus.host = d.host || 'Arch Linux';
          if (d.database && d.database.question_bank_stats) {
            qBankStats = d.database.question_bank_stats;
          }
          return;
        }
      } catch (e) {}
      serverStatus.state = 'offline';
      serverStatus.latencyMs = null;
    }

    async function checkAuthMe() {
      if (!authToken) return;
      try {
        const r = await fetch('/api/auth/me', { headers: authHeaders() });
        if (r.ok) {
          const d = await r.json();
          if (d.authenticated && d.user) {
            currentUser = d.user;
            if (d.progress) progress = Object.assign(progress, d.progress);
            if (d.recent_attempts) examHistory = d.recent_attempts;
          } else {
            authToken = null;
            currentUser = null;
            localStorage.removeItem(AUTH_KEY);
          }
        }
      } catch (e) {}
    }

    async function fetchQuestionBankStats() {
      try {
        const r = await fetch('/api/questions/stats');
        if (r.ok) qBankStats = await r.json();
      } catch (e) {}
    }

    async function loadCategoryQuestions(cat, search = '') {
      qBankLoading = true;
      renderApp();
      try {
        let url = `/api/questions?category=${encodeURIComponent(cat)}&limit=100`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          let qs = data.questions || [];
          if (search) {
            const s = search.toLowerCase();
            qs = qs.filter(q => q.q.toLowerCase().includes(s) || (q.tip && q.tip.toLowerCase().includes(s)));
          }
          qBankQuestions = qs;
        }
      } catch (e) {}
      qBankLoading = false;
      renderApp();
    }

    async function loadHistory() {
      if (!authToken) return;
      try {
        const res = await fetch('/api/history', { headers: authHeaders() });
        if (res.ok) {
          const d = await res.json();
          if (d && d.history) examHistory = d.history;
        }
      } catch (e) {}
    }

    /* ==========================================================================
       QUIZ ENGINE: GENERATION & LAUNCH
       ========================================================================== */
    async function startQuizFromTopic(subjectKey, topicIdx, mode = 'zen') {
      const s = SUBJECTS[subjectKey];
      const topicName = s.topics[topicIdx];
      await launchQuiz({
        id: `topic_${subjectKey}_${topicIdx}`,
        title: `${s.name} Drill`,
        subtitle: topicName,
        subjectKey,
        topicName,
        track: currentTrack,
        mode,
        count: 10
      });
    }

    async function startMixedMock(mode = 'exam') {
      await launchQuiz({
        id: `mock_mixed_${Date.now()}`,
        title: currentTrack === 'mpsc' ? 'MPSC State Cadre Mock Examination' : 'DSC West Khasi Hills Full Syllabus Mock',
        subtitle: '100 Marks · Comprehensive Cadre Syllabus Distribution',
        isMixed: true,
        track: currentTrack,
        mode,
        count: 50
      });
    }

    async function startDailyRotation(dayNum) {
      const rot = ROTATION.find(r => r.day === dayNum) || ROTATION[0];
      if (rot.mixed) {
        await startMixedMock('exam');
      } else {
        const s = SUBJECTS[rot.subject];
        await launchQuiz({
          id: `day_${dayNum}`,
          title: `Day ${dayNum}: ${s.name}`,
          subtitle: s.topics[rot.topic],
          subjectKey: rot.subject,
          topicName: s.topics[rot.topic],
          dayNum,
          track: currentTrack,
          mode: 'zen',
          count: 15
        });
      }
    }

    async function launchQuiz(meta) {
      genLoading = { done: 0, total: meta.count, statusText: 'Connecting to Arch Linux Question Bank & Gemini...' };
      activeTab = 'arena';
      renderApp();

      let questions = [];

      try {
        // 1. Try fetching from SQL question bank first for instant load
        if (!meta.isMixed && meta.subjectKey) {
          const localRes = await fetch(`/api/questions?category=${encodeURIComponent(meta.subjectKey)}&limit=${meta.count}`);
          if (localRes.ok) {
            const data = await localRes.json();
            if (data.questions && data.questions.length >= meta.count) {
              questions = data.questions.slice(0, meta.count);
            }
          }
        }

        // 2. If needed, request AI generation via Gemini
        if (questions.length < meta.count) {
          genLoading.statusText = `Generating high-yield calibrated MCQs via Gemini (${currentTrack.toUpperCase()})...`;
          renderApp();

          const genRes = await fetch('/api/generate', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({
              subjectName: meta.isMixed ? 'General Knowledge' : SUBJECTS[meta.subjectKey].name,
              topicName: meta.topicName || 'Mixed Comprehensive Syllabus',
              category: meta.subjectKey || 'gk',
              count: meta.count,
              track: meta.track || currentTrack
            })
          });

          if (genRes.ok) {
            const genData = await genRes.json();
            if (genData.questions && genData.questions.length > 0) {
              questions = questions.concat(genData.questions);
            }
          }
        }
      } catch (err) {
        console.warn('Backend generation failed, using curated fallback set:', err);
      }

      // 3. Robust fallback if offline or backend cold
      if (questions.length === 0) {
        questions = getCuratedFallbackQuestions(meta.subjectKey || 'gk');
      }

      genLoading = null;
      activeQuiz = {
        id: meta.id,
        title: meta.title,
        subtitle: meta.subtitle,
        subjectKey: meta.subjectKey || 'gk',
        isMixed: !!meta.isMixed,
        dayNum: meta.dayNum || null,
        mode: meta.mode || 'zen',
        questions: questions,
        answers: {},
        flagged: {},
        submitted: false,
        startedAt: Date.now()
      };
      currentQIndex = 0;
      isFlipped = false;

      if (meta.mode === 'exam') {
        timeRemaining = questions.length >= 50 ? 7200 : questions.length * 90; // seconds
        startExamTimer();
      } else {
        clearInterval(timerInterval);
        timeRemaining = 0;
      }

      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ==========================================================================
       QUIZ ACTIONS & KEYBOARD CONTROLS
       ========================================================================== */
    function selectOption(letter) {
      if (!activeQuiz || activeQuiz.submitted) return;
      activeQuiz.answers[currentQIndex] = letter;

      if (activeQuiz.mode === 'zen') {
        const q = activeQuiz.questions[currentQIndex];
        if (letter === q.correct) {
          streakCount++;
        } else {
          streakCount = 0;
        }
      }
      renderApp();
    }

    function toggleFlag() {
      if (!activeQuiz) return;
      activeQuiz.flagged[currentQIndex] = !activeQuiz.flagged[currentQIndex];
      renderApp();
    }

    function jumpToQuestion(idx) {
      if (!activeQuiz || idx < 0 || idx >= activeQuiz.questions.length) return;
      currentQIndex = idx;
      isFlipped = false;
      renderApp();
    }

    function nextQuestion() {
      if (!activeQuiz) return;
      if (currentQIndex < activeQuiz.questions.length - 1) {
        currentQIndex++;
        isFlipped = false;
        renderApp();
      }
    }

    function prevQuestion() {
      if (!activeQuiz) return;
      if (currentQIndex > 0) {
        currentQIndex--;
        isFlipped = false;
        renderApp();
      }
    }

    function startExamTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timeRemaining > 0) {
          timeRemaining--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          submitExam();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const el = document.getElementById('quiz-timer');
      if (!el) return;
      const m = Math.floor(timeRemaining / 60);
      const s = timeRemaining % 60;
      el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      if (timeRemaining < 300) {
        el.parentElement.classList.add('warning');
      }
    }

    async function submitExam() {
      if (!activeQuiz || activeQuiz.submitted) return;
      clearInterval(timerInterval);
      activeQuiz.submitted = true;

      let score = 0;
      activeQuiz.questions.forEach((q, idx) => {
        if (activeQuiz.answers[idx] === q.correct) score++;
      });
      const total = activeQuiz.questions.length;

      // Update progress
      progress.lifetime.answered += total;
      progress.lifetime.correct += score;

      if (activeQuiz.subjectKey && progress.bySubject[activeQuiz.subjectKey]) {
        progress.bySubject[activeQuiz.subjectKey].a += total;
        progress.bySubject[activeQuiz.subjectKey].c += score;
      }

      if (activeQuiz.dayNum) {
        progress.completed[activeQuiz.dayNum] = { score, total, ts: Date.now(), label: activeQuiz.title };
        const now = Date.now();
        const oneDay = 86400000;
        if (progress.lastCompletedTs && (now - progress.lastCompletedTs) < oneDay * 2.2) {
          progress.streak += 1;
        } else {
          progress.streak = 1;
        }
        progress.lastCompletedTs = now;
      }

      saveLocalProgress();

      // Record to SQLite history
      if (authToken) {
        try {
          await fetch('/api/history', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({
              exam_title: activeQuiz.title,
              subject_key: activeQuiz.subjectKey,
              day_num: activeQuiz.dayNum,
              score,
              total
            })
          });
          await loadHistory();
        } catch (e) {}
      }

      openScoreModal(score, total);
      renderApp();
    }

    function handleGlobalKeydown(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (!activeQuiz || activeQuiz.submitted) return;

      const k = e.key.toLowerCase();
      if (['1', 'a'].includes(k)) selectOption('a');
      if (['2', 'b'].includes(k)) selectOption('b');
      if (['3', 'c'].includes(k)) selectOption('c');
      if (['4', 'd'].includes(k)) selectOption('d');
      if (['f'].includes(k)) toggleFlag();
      if (['arrowright', 'enter'].includes(k) && currentQIndex < activeQuiz.questions.length - 1) nextQuestion();
      if (['arrowleft'].includes(k) && currentQIndex > 0) prevQuestion();
      if (e.code === 'Space' && activeQuiz.mode === 'flashcard') {
        e.preventDefault();
        isFlipped = !isFlipped;
        renderApp();
      }
    }

    async function submitAuth() {
      const u = document.getElementById('auth-username').value.trim();
      const p = document.getElementById('auth-password').value.trim();
      const n = document.getElementById('auth-notice');
      if (!u || !p) {
        n.style.display = 'block';
        n.style.background = 'var(--color-danger-light)';
        n.style.color = 'var(--color-danger)';
        n.textContent = 'Please enter both username and password.';
        return;
      }

      const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          n.style.display = 'block';
          n.style.background = 'var(--color-danger-light)';
          n.style.color = 'var(--color-danger)';
          n.textContent = data.error || 'Authentication rejected.';
          return;
        }

        authToken = data.token;
        localStorage.setItem(AUTH_KEY, authToken);
        currentUser = data.user;
        if (data.progress) progress = Object.assign(progress, data.progress);
        closeModal();
        await loadHistory();
        renderApp();
      } catch (err) {
        n.style.display = 'block';
        n.style.background = 'var(--color-danger-light)';
        n.style.color = 'var(--color-danger)';
        n.textContent = 'Network or server connection failed.';
      }
    }

       ========================================================================== */

    function renderApp() {
      const shell = document.getElementById('app');
      if (!shell) return;

      shell.innerHTML = `
        ${renderNavbar()}
        <main style="display:flex; flex-direction:column; gap:24px;">
          ${renderActiveView()}
        </main>
        ${renderFooter()}
      `;
    }

    function renderNavbar() {
      return `
        <header class="navbar">
          <div class="nav-brand" onclick="activeTab='dashboard'; renderApp();">
            <div class="brand-logo-badge">${svgIcon('shield', 'lg')}</div>
            <div class="brand-text">
              <span class="brand-title">Apex LDA Arena</span>
              <span class="brand-subtitle">Meghalaya & WK Hills Cadre</span>
            </div>
          </div>

          <nav class="nav-tabs">
            <button class="nav-tab-btn ${activeTab === 'dashboard' ? 'active' : ''}" onclick="activeTab='dashboard'; renderApp();">
              ${svgIcon('bolt')} Overview
            </button>
            <button class="nav-tab-btn ${activeTab === 'arena' ? 'active' : ''}" onclick="activeTab='arena'; renderApp();">
              ${svgIcon('brain')} Quiz Arena
            </button>
            <button class="nav-tab-btn ${activeTab === 'generator' ? 'active' : ''}" onclick="activeTab='generator'; renderApp();">
              ${svgIcon('sparkles')} AI Studio
            </button>
            <button class="nav-tab-btn ${activeTab === 'bank' ? 'active' : ''}" onclick="activeTab='bank'; loadCategoryQuestions(qBankSelectedCategory); renderApp();">
              ${svgIcon('database')} Question Bank
            </button>
            <button class="nav-tab-btn ${activeTab === 'roadmap' ? 'active' : ''}" onclick="activeTab='roadmap'; renderApp();">
              ${svgIcon('layers')} 30-Day Plan
            </button>
          </nav>

          <div class="nav-actions">
            <div class="server-status-pill" title="Arch Linux & Gemini Backend">
              <span class="status-dot ${serverStatus.state}"></span>
              <span>${serverStatus.state === 'online' ? `${serverStatus.latencyMs}ms` : 'Offline'}</span>
            </div>

            <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
              ${svgIcon(currentTheme === 'dark' ? 'sun' : 'moon')}
            </button>

            ${currentUser ? `
              <div class="user-pill" onclick="logoutUser()" title="Click to Sign Out">
                ${svgIcon('user')} ${currentUser.username}
              </div>
            ` : `
              <button class="btn btn-primary sm" onclick="openAuthModal()">
                ${svgIcon('user')} Sign In
              </button>
            `}
          </div>
        </header>
      `;
    }

    function renderActiveView() {
      if (genLoading) {
        return `
          <div class="card" style="text-align:center; padding:60px 20px; align-items:center; gap:16px;">
            <div class="brand-logo-badge" style="width:64px; height:64px; animation:pulse 1.5s infinite;">
              ${svgIcon('sparkles', 'xl')}
            </div>
            <h2>Generating High-Yield Examination Questions</h2>
            <p style="color:var(--text-secondary); max-width:500px;">${genLoading.statusText}</p>
            <div class="quiz-progress-bar-container" style="max-width:400px; height:8px;">
              <div class="quiz-progress-fill" style="width:75%; animation:pulse 1.2s infinite;"></div>
            </div>
          </div>
        `;
      }

      switch (activeTab) {
        case 'dashboard': return renderDashboardView();
        case 'arena':     return renderQuizArenaView();
        case 'generator': return renderGeneratorView();
        case 'bank':      return renderQuestionBankView();
        case 'roadmap':   return renderRoadmapView();
        default:          return renderDashboardView();
      }
    }

    /* ------------------- DASHBOARD VIEW ------------------- */
    function renderDashboardView() {
      const curDay = progress.currentDay || 1;
      const rot = ROTATION.find(r => r.day === curDay) || ROTATION[0];
      const sName = rot.mixed ? 'Full Syllabus Mock' : SUBJECTS[rot.subject].name;
      const tName = rot.mixed ? 'Checkpoint Simulation' : SUBJECTS[rot.subject].topics[rot.topic];
      const lifetimeAcc = progress.lifetime.answered > 0 ? Math.round((progress.lifetime.correct / progress.lifetime.answered) * 100) : 0;

      return `
        <!-- Hero Command Banner -->
        <div class="hero-banner">
          <div class="hero-left">
            <div class="hero-meta-row">
              <span class="badge" style="background:var(--color-primary-light); color:var(--color-primary);">
                ${svgIcon('flame')} Day ${curDay} of 30
              </span>
              <span class="badge" style="background:var(--color-accent-light); color:var(--color-accent);">
                ${currentTrack === 'mpsc' ? 'State Cadre (MPSC)' : 'District Cadre (WK Hills)'}
              </span>
              <button class="btn btn-ghost sm" onclick="openPromptInspector()">
                ${svgIcon('helpCircle')} View Prompts
              </button>
            </div>

            <h1 class="hero-title">${sName}</h1>
            <p class="hero-desc">
              Today's targeted mission: <strong>${tName}</strong>. Master foundational district concepts, local Nongstoin & Meghalaya geography, and clerical arithmetic.
            </p>

            <div class="hero-actions">
              <button class="btn btn-accent lg" onclick="startDailyRotation(${curDay})">
                ${svgIcon('bolt')} Launch Today's Mission (Day ${curDay})
              </button>
              <button class="btn btn-secondary lg" onclick="startMixedMock('exam')">
                ${svgIcon('clock')} Full Mock (100 Marks)
              </button>
            </div>
          </div>

          <div class="hero-stats-panel">
            <div class="stat-tile">
              <div class="stat-val" style="color:var(--color-accent);">${progress.streak || 0}</div>
              <div class="stat-lbl">Day Streak</div>
            </div>
            <div class="stat-tile">
              <div class="stat-val" style="color:var(--color-success);">${lifetimeAcc}%</div>
              <div class="stat-lbl">Accuracy</div>
            </div>
            <div class="stat-tile">
              <div class="stat-val">${progress.lifetime.answered}</div>
              <div class="stat-lbl">MCQs Solved</div>
            </div>
            <div class="stat-tile">
              <div class="stat-val" style="color:var(--color-primary);">${Object.keys(progress.completed || {}).length}/30</div>
              <div class="stat-lbl">Days Cleared</div>
            </div>
          </div>
        </div>

        <!-- Bento Grid: Subjects & Quick Drills -->
        <div>
          <div class="section-header">
            <div class="section-title-box">
              <h2 class="section-title">Syllabus Domains & Rapid Drills</h2>
              <span class="section-badge">6 Subjects</span>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn sm ${currentTrack === 'dsc' ? 'btn-primary' : 'btn-secondary'}" onclick="currentTrack='dsc'; renderApp();">
                DSC Nongstoin Bar
              </button>
              <button class="btn sm ${currentTrack === 'mpsc' ? 'btn-primary' : 'btn-secondary'}" onclick="currentTrack='mpsc'; renderApp();">
                MPSC 2025 Bar
              </button>
            </div>
          </div>

          <div class="bento-grid">
            ${Object.entries(SUBJECTS).map(([k, s]) => `
              <div class="card col-4 subject-card" onclick="startQuizFromTopic('${k}', 0, 'zen')">
                <div class="subject-top-row">
                  <div class="subject-badge" style="color:${s.colorVar};">
                    <div class="subject-icon-box" style="background:${s.bgVar}; color:${s.colorVar};">
                      ${svgIcon(s.icon)}
                    </div>
                    <span>${s.name}</span>
                  </div>
                  <span class="badge" style="background:var(--bg-surface-subtle); color:var(--text-muted);">
                    ${s.weightExam ? `${s.weightExam} Marks` : 'Supplementary'}
                  </span>
                </div>

                <div class="subject-topics-list">
                  ${s.topics.map((t, idx) => `
                    <div class="topic-chip" onclick="event.stopPropagation(); startQuizFromTopic('${k}', ${idx}, 'zen');" title="Click to drill: ${t}">
                      ${t}
                    </div>
                  `).join('')}
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:10px; border-top:1px solid var(--border-subtle); font-size:12px; color:var(--text-muted);">
                  <span>${s.topics.length} Syllabus Modules</span>
                  <span style="color:var(--color-primary); font-weight:700; display:flex; align-items:center; gap:4px;">
                    Drill ${svgIcon('chevronRight', 'sm')}
                  </span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    /* ------------------- QUIZ ARENA VIEW ------------------- */
    function renderQuizArenaView() {
      if (!activeQuiz || !activeQuiz.questions || activeQuiz.questions.length === 0) {
        return `
          <div class="card" style="text-align:center; padding:60px 20px; align-items:center; gap:16px;">
            <div class="brand-logo-badge" style="width:64px; height:64px;">${svgIcon('brain', 'xl')}</div>
            <h2>Quiz Arena Standby</h2>
            <p style="color:var(--text-secondary); max-width:480px;">
              Select a module from the dashboard or launch a custom timed exam mock to enter the interactive arena.
            </p>
            <div style="display:flex; gap:12px;">
              <button class="btn btn-primary" onclick="activeTab='dashboard'; renderApp();">Browse Syllabus Modules</button>
              <button class="btn btn-accent" onclick="startMixedMock('exam')">Start 100-Mark Mock</button>
            </div>
          </div>
        `;
      }

      const q = activeQuiz.questions[currentQIndex];
      const selected = activeQuiz.answers[currentQIndex];
      const isZen = activeQuiz.mode === 'zen';
      const isFlash = activeQuiz.mode === 'flashcard';
      const isFlagged = !!activeQuiz.flagged[currentQIndex];

      return `
        <div class="quiz-container">
          <!-- Quiz Top Meta -->
          <div class="quiz-header-card">
            <div class="quiz-info-meta">
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="badge" style="background:var(--color-primary-light); color:var(--color-primary);">
                  ${activeQuiz.mode.toUpperCase()} MODE
                </span>
                ${activeQuiz.isMixed ? `<span class="badge" style="background:var(--color-accent-light); color:var(--color-accent);">FULL MOCK</span>` : ''}
              </div>
              <h2 class="quiz-title">${activeQuiz.title}</h2>
              <span class="quiz-subtitle">${activeQuiz.subtitle}</span>
            </div>

            <div style="display:flex; align-items:center; gap:12px;">
              ${activeQuiz.mode === 'exam' ? `
                <div class="quiz-timer-box">
                  ${svgIcon('clock')}
                  <span id="quiz-timer">--:--</span>
                </div>
              ` : `
                <div class="quiz-timer-box" style="color:var(--color-accent);">
                  ${svgIcon('flame')} ${streakCount} Streak
                </div>
              `}

              <button class="btn btn-secondary sm" onclick="submitExam()">
                Finish & Score
              </button>
            </div>
          </div>

          <!-- Stepper bar -->
          <div class="quiz-progress-bar-container">
            <div class="quiz-progress-fill" style="width: ${((currentQIndex + 1) / activeQuiz.questions.length) * 100}%;"></div>
          </div>

          <!-- Flashcard Mode View -->
          ${isFlash ? `
            <div class="flashcard-wrapper ${isFlipped ? 'flipped' : ''}" onclick="isFlipped = !isFlipped; renderApp();">
              <div class="flashcard-inner">
                <div class="flashcard-front">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="question-index-badge">CARD ${currentQIndex + 1} OF ${activeQuiz.questions.length}</span>
                    <span style="font-size:12px; color:var(--text-muted);">Click to reveal answer (Space)</span>
                  </div>
                  <div style="font-size:22px; font-weight:700; line-height:1.5;">${q.q}</div>
                  <div style="display:flex; justify-content:flex-end;">
                    <span class="btn sm btn-secondary">${svgIcon('rotateCcw')} Flip Card</span>
                  </div>
                </div>

                <div class="flashcard-back">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="badge" style="background:var(--color-success-light); color:var(--color-success);">CORRECT KEY</span>
                    <span style="font-size:12px; color:var(--text-muted);">Option (${q.correct.toUpperCase()})</span>
                  </div>
                  <div style="font-size:20px; font-weight:700; color:var(--color-success);">${q[q.correct]}</div>
                  <div style="background:var(--bg-surface-subtle); padding:12px; border-radius:var(--radius-sm); font-size:13px; color:var(--text-secondary);">
                    <strong>Key Insight:</strong> ${q.tip || 'Standard syllabus specification.'}
                  </div>
                </div>
              </div>
            </div>
          ` : `
            <!-- Standard / Zen Question Card -->
            <div class="question-card">
              <div class="question-top-bar">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="question-index-badge">QUESTION ${currentQIndex + 1} OF ${activeQuiz.questions.length}</span>
                  <span style="font-size:12px; color:var(--text-muted); font-family:var(--font-mono);">
                    [Keys: 1-4 or A-D]
                  </span>
                </div>

                <div class="question-actions-bar">
                  <button class="btn sm ${isFlagged ? 'btn-accent' : 'btn-ghost'}" onclick="toggleFlag()">
                    ${svgIcon('bookmark')} ${isFlagged ? 'Flagged' : 'Flag'}
                  </button>
                </div>
              </div>

              <div class="question-text">${q.q}</div>

              <!-- Options Grid -->
              <div class="options-grid">
                ${['a', 'b', 'c', 'd'].map(letter => {
                  let cls = '';
                  if (selected === letter) cls += ' selected';
                  if (isZen && selected) {
                    if (letter === q.correct) cls += ' correct';
                    else if (selected === letter) cls += ' wrong';
                  }

                  return `
                    <div class="option-btn ${cls}" onclick="selectOption('${letter}')">
                      <div class="option-key-badge">${letter.toUpperCase()}</div>
                      <div class="option-text">${q[letter]}</div>
                      ${isZen && selected && letter === q.correct ? svgIcon('check', 'sm') : ''}
                      ${isZen && selected === letter && letter !== q.correct ? svgIcon('x', 'sm') : ''}
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Zen Immediate Explanation Box -->
              ${isZen && selected ? `
                <div class="tip-box">
                  <div class="tip-header">
                    ${svgIcon('sparkles', 'sm')} Meghalaya Fact & Explanation
                  </div>
                  <div class="tip-body">${q.tip || 'Factual concept for DSC West Khasi Hills & MPSC recruitment.'}</div>
                </div>
              ` : ''}

              <!-- Quiz Card Footer Controls -->
              <div class="quiz-footer" style="padding-top:16px; border-top:1px solid var(--border-subtle);">
                <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQIndex === 0 ? 'disabled style="opacity:0.4;"' : ''}>
                  ${svgIcon('chevronLeft')} Previous
                </button>

                <div style="display:flex; gap:8px;">
                  <button class="btn btn-secondary sm" onclick="quizMode = quizMode === 'zen' ? 'flashcard' : 'zen'; renderApp();">
                    ${svgIcon('rotateCcw')} Switch to ${activeQuiz.mode === 'zen' ? 'Flashcard' : 'Zen'}
                  </button>
                </div>

                <button class="btn btn-primary" onclick="nextQuestion()" ${currentQIndex === activeQuiz.questions.length - 1 ? 'disabled style="opacity:0.4;"' : ''}>
                  Next ${svgIcon('chevronRight')}
                </button>
              </div>
            </div>
          `}

          <!-- Question Palette Drawer -->
          <div class="card" style="padding:16px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:12px; font-weight:700; color:var(--text-muted);">
              <span>QUESTION NAVIGATOR (${Object.keys(activeQuiz.answers).length}/${activeQuiz.questions.length} Answered)</span>
              <span>Jump directly:</span>
            </div>
            <div class="quiz-drawer-grid">
              ${activeQuiz.questions.map((_, idx) => {
                let dotCls = '';
                if (idx === currentQIndex) dotCls += ' current';
                if (activeQuiz.answers[idx]) dotCls += ' answered';
                if (activeQuiz.flagged[idx]) dotCls += ' flagged';
                return `
                  <button class="q-dot-btn ${dotCls}" onclick="jumpToQuestion(${idx})">${idx + 1}</button>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /* ------------------- AI STUDIO GENERATOR ------------------- */
    function renderGeneratorView() {
      return `
        <div class="card" style="max-width:800px; margin:0 auto; width:100%; gap:24px;">
          <div>
            <h2>AI Question Generation Studio</h2>
            <p style="color:var(--text-secondary); font-size:14px;">
              Synthesize authentic, tailored examination questions calibrated directly against Meghalaya State & District standards.
            </p>
          </div>

          <div class="form-group">
            <label class="form-label">Cadre Track Calibration</label>
            <div class="track-radio-group">
              <div class="track-radio-card ${currentTrack === 'dsc' ? 'active' : ''}" onclick="currentTrack='dsc'; renderApp();">
                <div class="track-name">District Selection Committee (DSC)</div>
                <div class="track-desc">West Khasi Hills, Nongstoin · SSLC / Class 10 Foundational Standard</div>
              </div>
              <div class="track-radio-card ${currentTrack === 'mpsc' ? 'active' : ''}" onclick="currentTrack='mpsc'; renderApp();">
                <div class="track-name">Meghalaya Public Service Commission (MPSC)</div>
                <div class="track-desc">State Cadre LDA · July 2025 Authentic Benchmark</div>
              </div>
            </div>
          </div>

          <div class="bento-grid">
            <div class="form-group col-6">
              <label class="form-label">Target Subject</label>
              <select class="form-select" id="gen-subject" onchange="renderApp()">
                ${Object.entries(SUBJECTS).map(([k, s]) => `
                  <option value="${k}" ${k === qBankSelectedCategory ? 'selected' : ''}>${s.name}</option>
                `).join('')}
              </select>
            </div>

            <div class="form-group col-6">
              <label class="form-label">Specific Syllabus Topic</label>
              <select class="form-select" id="gen-topic">
                ${(SUBJECTS[document.getElementById('gen-subject') ? document.getElementById('gen-subject').value : 'gk'] || SUBJECTS.gk).topics.map(t => `
                  <option value="${t}">${t}</option>
                `).join('')}
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Number of Questions to Generate</label>
            <div style="display:flex; gap:12px;">
              ${[5, 10, 15, 25, 50].map(cnt => `
                <button class="btn sm btn-secondary" onclick="generateCustomQuiz(${cnt})">
                  ${cnt} Questions
                </button>
              `).join('')}
            </div>
          </div>

          <div style="padding-top:16px; border-top:1px solid var(--border-subtle); display:flex; justify-content:space-between; align-items:center;">
            <button class="btn btn-ghost" onclick="openPromptInspector()">
              ${svgIcon('copy')} Inspect Backend Prompts
            </button>
            <button class="btn btn-primary lg" onclick="generateCustomQuiz(10)">
              ${svgIcon('sparkles')} Generate & Start Drill
            </button>
          </div>
        </div>
      `;
    }

    async function generateCustomQuiz(count) {
      const sEl = document.getElementById('gen-subject');
      const tEl = document.getElementById('gen-topic');
      const subjectKey = sEl ? sEl.value : 'gk';
      const topicName = tEl ? tEl.value : SUBJECTS[subjectKey].topics[0];

      await launchQuiz({
        id: `custom_${subjectKey}_${Date.now()}`,
        title: `${SUBJECTS[subjectKey].name} AI Drill`,
        subtitle: topicName,
        subjectKey,
        topicName,
        track: currentTrack,
        mode: 'zen',
        count
      });
    }

              </p>

              <input class="form-input" style="width:280px;" placeholder="Search questions or keywords..." value="${qBankSearchTerm}" oninput="qBankSearchTerm = this.value; loadCategoryQuestions(qBankSelectedCategory, this.value);">

          <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;">

        </div>

    /* ------------------- 30-DAY ROADMAP VIEW ------------------- */
    function renderRoadmapView() {
      return `
        <div style="display:flex; flex-direction:column; gap:20px;">
          <div>
            <h2 class="section-title">30-Day Cadre Rotation Curriculum</h2>
            <p style="font-size:14px; color:var(--text-secondary);">
              Structured systematic syllabus coverage designed for West Khasi Hills District Selection & MPSC entry.
            </p>
          </div>

          <div class="bento-grid">
            ${ROTATION.map(r => {
              const isCleared = !!progress.completed[r.day];
              const isCurrent = (progress.currentDay || 1) === r.day;
              const s = r.mixed ? null : SUBJECTS[r.subject];

              return `
                <div class="card col-3" style="padding:18px; gap:10px; ${isCurrent ? 'border-color:var(--color-primary); box-shadow:0 0 16px var(--color-primary-glow);' : ''}">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-family:var(--font-heading); font-size:16px; font-weight:800;">DAY ${r.day}</span>
                    ${isCleared ? `<span class="badge" style="background:var(--color-success-light); color:var(--color-success);">${svgIcon('check', 'sm')} Done</span>` : isCurrent ? `<span class="badge" style="background:var(--color-primary-light); color:var(--color-primary);">Today</span>` : ''}
                  </div>

                  <div style="font-size:14px; font-weight:700; color:${s ? s.colorVar : 'var(--color-accent)'};">
                    ${r.mixed ? (r.final ? 'Final Full-Syllabus Mock' : 'Checkpoint Mock') : s.name}
                  </div>

                  <div style="font-size:12px; color:var(--text-secondary); line-height:1.4;">
                    ${r.mixed ? '100 Marks balanced Cadre simulation' : s.topics[r.topic]}
                  </div>

                  <button class="btn sm ${isCurrent ? 'btn-accent' : 'btn-secondary'}" style="margin-top:auto;" onclick="startDailyRotation(${r.day})">
                    ${svgIcon('bolt')} Practice Day ${r.day}
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    /* ------------------- FOOTER ------------------- */
    function renderFooter() {
      return `
        <footer class="footer">
          <div class="footer-brand">
            APEX LDA EXAM ARENA · MEGHALAYA & WEST KHASI HILLS RECRUITMENT SUITE
          </div>
          <div>
            Arch Linux SQLite Question Bank · Gemini 3.6 Flash Engine · Zero External Dependencies
          </div>
        </footer>
      `;
    }

    // Initialize application on load
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
